<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wobkot PS4 Jailbreak</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; text-align: center;}
  #wrap { padding:40px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #cache { font-size:14px; color:#5c6672; margin:0 0 30px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  #btn { display: none; width: 80%; max-width: 400px; padding: 25px; 
         background: #2ea043; color: white; font-size: 24px; font-weight: bold; 
         border: none; border-radius: 8px; margin: 0 auto; cursor: pointer; }
  .warn { color:#d8c07f; }
  #brand { text-align:center; padding:10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand b { font-size:18px; font-weight:700; letter-spacing:.14em; color:#e6ebf2; }
  iframe { display: none; } /* Hides the background exploit page */
</style>
</head>
<body>
<div id="brand"><b>WOBKOT JAILBREAK</b></div>
<div id="wrap">
  <div id="state">Initializing...</div>
  <div id="cache">Checking cache...</div>
  
  <!-- THE JAILBREAK BUTTON -->
  <button id="btn" onclick="runExploit()">RUN JAILBREAK</button>
  
  <!-- THIS IS WHERE THE EXPLOIT ACTUALLY RUNS -->
  <iframe id="exploitFrame"></iframe>
</div>

<script>
  var stateEl = document.getElementById("state");
  var cacheEl = document.getElementById("cache");
  var btnEl = document.getElementById("btn");
  var frameEl = document.getElementById("exploitFrame");

  function runExploit() {
    btnEl.style.display = "none";
    stateEl.textContent = "Running Exploit... Do not close browser.";
    stateEl.className = "warn";
    
    // Load main.js inside the hidden iframe
    frameEl.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head><meta charset="utf-8"></head>
      <body>
        <script src="main.js"><\/script>
      </body>
      </html>
    `;
  }

  function showButton(text) {
    stateEl.textContent = text;
    btnEl.style.display = "block"; 
  }

  var ac = window.applicationCache;
  if (!ac || !document.documentElement.hasAttribute("manifest")) {
    showButton("Ready (No Cache)");
  } else if (ac.status === ac.IDLE || ac.status === ac.UPDATEREADY) {
    cacheEl.textContent = "Cached offline";
    showButton("Ready to Run");
  } else {
    stateEl.textContent = "Caching files...";
    ac.addEventListener("progress", function (e) {
      if (e && e.total) cacheEl.textContent = "Caching " + Math.round((e.loaded / e.total) * 100) + "%";
    }, false);

    ac.addEventListener("cached", function () {
      cacheEl.textContent = "Cached for offline use";
      cacheEl.className = "cacheok";
      showButton("Ready to Run");
    }, false);
  }
</script>
</body>
</html>
